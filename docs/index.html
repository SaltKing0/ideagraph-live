<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>IdeaGraph Cockpit</title>
  <style>
    :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3; --dim:#8b949e;
            --green:#3fb950; --red:#f85149; --blue:#58a6ff; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font-family:ui-monospace,Menlo,monospace; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

    /* Ingest-Leiste */
    #bar { display:flex; gap:8px; padding:10px 14px; border-bottom:1px solid var(--border); flex:none; }
    #bar input { flex:1; background:var(--panel); border:1px solid var(--border); color:var(--fg); padding:8px 12px; font-family:inherit; border-radius:6px; outline:none; }
    #bar input:focus { border-color:var(--blue); }
    #bar button { background:#238636; border:none; color:#fff; padding:8px 16px; font-family:inherit; cursor:pointer; border-radius:6px; }

    #main { flex:1; display:flex; min-height:0; }
    #graphwrap { flex:1; position:relative; min-width:0; }
    svg { display:block; }
    #brand { position:absolute; top:10px; left:14px; font-size:11px; color:var(--dim); pointer-events:none; }

    /* Inbox rechts */
    #inbox { width:380px; flex:none; border-left:1px solid var(--border); overflow-y:auto; padding:12px; }
    #inbox h2 { margin:0 0 10px; font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:10px; font-size:13px; }
    .card.active { border-color:var(--blue); box-shadow:0 0 0 1px var(--blue); }
    .kind { display:inline-block; font-size:11px; padding:1px 8px; border-radius:10px; border:1px solid var(--border); color:var(--dim); margin-bottom:8px; }
    .sim { float:right; font-size:11px; color:var(--dim); }
    .pair { display:flex; gap:8px; margin:8px 0; }
    .pair div { flex:1; background:var(--bg); border-radius:6px; padding:8px; max-height:90px; overflow:hidden; font-size:12px; line-height:1.4; color:var(--fg); }
    .actions { display:flex; gap:8px; margin-top:8px; }
    .actions button { flex:1; padding:6px; border-radius:6px; border:1px solid var(--border); background:#21262d; color:var(--fg); font-family:inherit; cursor:pointer; }
    .actions .ok { background:#23331f; border-color:var(--green); color:var(--green); }
    .actions .no { background:#3a1d1d; border-color:var(--red); color:var(--red); }
    #empty { color:var(--dim); font-size:12px; line-height:1.7; }

    /* Node-Detail Overlay */
    #detail { position:absolute; inset:0; background:rgba(13,17,23,.92); display:none; align-items:center; justify-content:center; }
    #detail.show { display:flex; }
    #detailbox { width:min(560px, 90%); background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:20px; max-height:80vh; overflow-y:auto; }
    #detailbox h3 { margin:0 0 4px; font-size:14px; word-break:break-word; }
    #detailbox .meta { font-size:11px; color:var(--dim); margin-bottom:12px; }
    #detailbox p { font-size:13px; line-height:1.6; white-space:pre-wrap; }
    #detailbox .rel { margin-top:14px; border-top:1px solid var(--border); padding-top:10px; font-size:12px; }
    #detailbox .rel b { color:var(--dim); font-weight:normal; }

    #help { flex:none; border-top:1px solid var(--border); padding:6px 14px; font-size:11px; color:var(--dim); }
    kbd { background:var(--panel); border:1px solid var(--border); border-radius:4px; padding:0 5px; margin-right:2px; }
    .flash { position:fixed; bottom:44px; left:50%; transform:translateX(-50%); background:var(--panel);
             border:1px solid var(--green); color:var(--green); padding:8px 18px; border-radius:6px; font-size:13px; opacity:0; transition:opacity .3s; pointer-events:none; }
  </style>
</head>
<body>
  <div id="bar">
    <input id="text" placeholder="Neue Idee… (i fokussiert, Enter ingestiert)">
    <button onclick="ingest()">Ingest</button>
  </div>

  <div id="main">
    <div id="graphwrap">
      <svg id="graph"></svg>
      <div id="brand">IdeaGraph Live — v0.1.1</div>
      <div id="detail"><div id="detailbox"></div></div>
    </div>
    <div id="inbox"><h2>Inbox · pending</h2><div id="cards"></div></div>
  </div>

  <div id="help">
    <kbd>j</kbd>/<kbd>k</kbd> Karte wählen &nbsp; <kbd>Enter</kbd> akzeptieren &nbsp;
    <kbd>Esc</kbd> verwerfen/schließen &nbsp; <kbd>i</kbd> Ingest-Feld &nbsp; <kbd>Space</kbd> Node-Text
  </div>
  <div class="flash" id="flash"></div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
