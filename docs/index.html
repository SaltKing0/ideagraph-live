<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>IdeaGraph Live</title>
  <style>
    body { margin: 0; background: #0d1117; color: #e6edf3; font-family: system-ui, sans-serif; overflow: hidden; }
    #bar { position: fixed; top: 0; left: 0; right: 0; padding: 12px 16px; background: rgba(13,17,23,.85); display: flex; gap: 8px; z-index: 10; }
    #bar input { flex: 1; background: #161b22; border: 1px solid #30363d; color: #e6edf3; padding: 8px 12px; border-radius: 6px; }
    #bar button { background: #238636; border: none; color: #fff; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    #pending { position: fixed; bottom: 12px; left: 16px; z-index: 10; max-width: 480px; }
    .pend { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 10px 12px; margin-top: 8px; font-size: 13px; }
    .pend button { margin-right: 6px; padding: 4px 10px; border-radius: 4px; border: 1px solid #30363d; cursor: pointer; background: #21262d; color: #e6edf3; }
    .pend .ok { background: #238636; color: #fff; }
    svg { display: block; }
    #hint { position: fixed; bottom: 12px; right: 16px; font-size: 12px; color: #8b949e; }
  </style>
</head>
<body>
  <div id="bar">
    <input id="text" placeholder="Neue Idee… (Enter zum Ingest)">
    <button onclick="ingest()">Ingest</button>
  </div>
  <svg id="graph"></svg>
  <div id="pending"></div>
  <div id="hint">IdeaGraph Live Engine v0.0.1 — Klick auf Node zeigt Text</div>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
